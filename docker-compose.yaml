# MediTech · un solo comando levanta todo el backend:
#   docker compose up --build
# Para incluir también el frontend (repo MediTech-Frontend):
#   docker compose --profile frontend up --build
#
# Los puertos de servicios internos y bases de datos se publican solo en 127.0.0.1
# (tu propia máquina). El único punto de entrada pensado para clientes es el gateway (8080).

x-service-env: &service-env
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  JWT_SECRET: ${JWT_SECRET:-meditech-super-secret-key-must-be-at-least-256-bits-long}

services:
  # ---------------- BASES DE DATOS (una por servicio) ----------------
  auth-db: &db-base
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["auth-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  product-db:
    <<: *db-base
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["product-data:/var/lib/mysql"]

  purchase-db:
    <<: *db-base
    environment:
      MYSQL_DATABASE: purchase_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3309:3306"]
    volumes: ["purchase-data:/var/lib/mysql"]

  notification-db:
    <<: *db-base
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3310:3306"]
    volumes: ["notification-data:/var/lib/mysql"]

  # ---------------- INFRAESTRUCTURA ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- CONFIGURACIÓN Y DESCUBRIMIENTO ----------------
  config-server:
    build: ./config-server
    ports: ["127.0.0.1:8888:8888"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  eureka-server:
    build: ./eureka-server
    ports: ["127.0.0.1:8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      config-server: { condition: service_healthy }

  # ---------------- MICROSERVICIOS ----------------
  auth-service:
    build: ./auth-service
    ports: ["127.0.0.1:8081:8081"]   # Swagger: http://localhost:8081/swagger-ui.html
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      auth-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

  product-service:
    build: ./product-service
    ports: ["127.0.0.1:8082:8082"]   # Swagger: http://localhost:8082/swagger-ui.html
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      product-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://product-db:3306/product_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

  purchase-service:
    build: ./purchase-service
    ports: ["127.0.0.1:8083:8083"]   # Swagger: http://localhost:8083/swagger-ui.html
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      purchase-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://purchase-db:3306/purchase_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  notification-service:
    build: ./notification-service
    ports: ["127.0.0.1:8084:8084"]   # Swagger: http://localhost:8084/docs
    depends_on:
      kafka: { condition: service_healthy }
      notification-db: { condition: service_healthy }
    environment:
      DB_HOST: notification-db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8082
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------- PUNTO DE ENTRADA ----------------
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      auth-service: { condition: service_started }
      product-service: { condition: service_started }
      purchase-service: { condition: service_started }
      notification-service: { condition: service_started }
    environment:
      <<: *service-env

  # ---------------- FRONTEND (opcional) ----------------
  # Se construye directamente desde el repositorio del frontend.
  frontend:
    profiles: ["frontend"]
    build:
      context: https://github.com/jro51/MediTech-Frontend.git#main
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  auth-data:
  product-data:
  purchase-data:
  notification-data:
