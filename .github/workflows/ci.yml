name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ---------------------------------------------------------------
  # Pruebas de los servicios Java (en paralelo, una por servicio)
  # `mvn verify` compila, corre JUnit y genera el reporte de cobertura (JaCoCo)
  # ---------------------------------------------------------------
  java-tests:
    name: Pruebas · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, purchase-service, api-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y probar
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "### ${{ matrix.service }}: cobertura de líneas %.1f%% (%d de %d)\n", 100*covered/(missed+covered), covered, missed+covered}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Pruebas del servicio de notificaciones (Python)
  # ---------------------------------------------------------------
  python-tests:
    name: Pruebas · notification-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notification-service/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas con cobertura mínima de 85%
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=85

  # ---------------------------------------------------------------
  # Construir todas las imágenes Docker (compila los servicios dentro de Docker)
  # ---------------------------------------------------------------
  docker-build:
    name: Construir imágenes Docker
    needs: [java-tests, python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validar docker-compose
        run: docker compose config --quiet
      - name: Construir imágenes
        run: docker compose build

  # ---------------------------------------------------------------
  # Entrega continua: publica las imágenes en GitHub Container Registry
  # (solo al hacer push a master y solo si todo lo anterior pasó)
  # ---------------------------------------------------------------
  publish-images:
    name: Publicar · ${{ matrix.service }}
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - config-server
          - eureka-server
          - api-gateway
          - auth-service
          - product-service
          - purchase-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/meditech-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/meditech-${{ matrix.service }}:${{ github.sha }}
